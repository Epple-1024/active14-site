<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>連絡 | ACTIVE14</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="/assets/site.css" rel="stylesheet" />
    <script src="/assets/site.js" defer></script>
    <link href="/assets/site.css" rel="stylesheet" />
    <script src="/assets/site.js" defer></script>
  </head>
  <body class="min-h-screen bg-sky-50 text-gray-900 font-sans">
    <header class="bg-white shadow-sm py-6 animate-fade-in">
      <div class="max-w-5xl mx-auto px-6 text-center">
        <h1 class="text-4xl font-extrabold text-sky-600 tracking-tight mb-2">ACTIVE14</h1>
        <p class="text-lg text-sky-500">海の未来を、僕らの手で。</p>
      </div>
      <nav class="max-w-5xl mx-auto px-6 mt-6">
        <div class="flex flex-wrap justify-center gap-3 text-sm sm:text-base">
          <a class="nav-link px-4 py-2 rounded-full font-semibold text-gray-700" href="/">トップ</a>
          <a class="nav-link px-4 py-2 rounded-full font-semibold text-gray-700" href="/join/">参加</a>
          <a class="nav-link px-4 py-2 rounded-full font-semibold text-gray-700" href="/report/">活動記録</a>
          <a class="nav-link px-4 py-2 rounded-full font-semibold text-sky-700" href="/contact/">連絡</a>
        </div>
      </nav>
    </header>

    <main class="py-10">
      <div class="max-w-5xl mx-auto px-6">
        <section class="bg-white rounded-3xl shadow-lg p-8 mb-10 animate-slide-up ui-card">
          <h2 class="text-3xl font-semibold text-sky-600 mb-4">メールでのご連絡</h2>
          <p class="text-lg mb-6">参加希望・ご質問は、以下の方法で受け付けています。原則としてメールでご連絡ください。</p>
          <a href="mailto:info@active14.org" class="inline-flex">
            <button class="bg-sky-600 hover:bg-sky-700 text-white text-lg px-6 py-3 rounded-full shadow-md transition-transform transform hover:scale-105 ui-button">メール作成画面を開く</button>
          </a>
        </section>

        <section class="bg-white rounded-3xl shadow-lg p-8 mb-10 animate-slide-up ui-card">
          <h2 class="text-3xl font-semibold text-sky-600 mb-4">メールアドレス</h2>
          <p class="text-lg mb-4">メールアプリが使えない場合は、以下のアドレスをコピーしてご利用ください。</p>
          <input
            class="w-full sm:w-96 border border-sky-200 rounded-lg px-4 py-3 text-lg bg-sky-50"
            type="text"
            value="info@active14.org"
            readonly
            onclick="this.select();"
          />
        </section>

        <section class="bg-white rounded-3xl shadow-lg p-8 mb-10 animate-slide-up ui-card">
          <h2 class="text-3xl font-semibold text-sky-600 mb-4">推奨文面</h2>
          <div class="bg-sky-50 border border-sky-100 rounded-2xl p-6 text-lg space-y-4">
            <p><span class="font-semibold">件名：</span>ACTIVE14 活動参加の件（氏名）</p>
            <div>
              <p class="font-semibold">本文例：</p>
              <p>はじめまして、（氏名）と申します。</p>
              <p>ACTIVE14の活動への参加を希望し、ご連絡いたしました。</p>
              <p class="mt-2">【希望日】〇月〇日</p>
              <p>【参加人数】〇名</p>
              <p class="mt-2">どうぞよろしくお願いいたします。</p>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
