<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2026年1月 活動記録 | ACTIVE14</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/dist/tailwind.min.css" rel="stylesheet" />
    <link href="/assets/site.css" rel="stylesheet" />
    <script src="/assets/site.js" defer></script>
  </head>
  <body class="min-h-screen bg-sky-50 text-gray-900 font-sans">
    <header class="bg-white shadow-sm py-6 animate-fade-in">
      <div class="max-w-5xl mx-auto px-6 text-center">
        <h1 class="text-4xl font-extrabold text-sky-600 tracking-tight mb-2">ACTIVE14</h1>
        <p class="text-lg text-sky-500">海の未来を、僕らの手で。</p>
      </div>
      <nav class="max-w-5xl mx-auto px-6 mt-6">
        <div class="flex flex-wrap justify-center gap-3 text-sm sm:text-base">
          <a class="nav-link px-4 py-2 rounded-full font-semibold text-gray-700" href="/">トップ</a>
          <a class="nav-link px-4 py-2 rounded-full font-semibold text-gray-700" href="/join/">参加</a>
          <a class="nav-link px-4 py-2 rounded-full font-semibold text-sky-700" href="/report/">活動記録</a>
          <a class="nav-link px-4 py-2 rounded-full font-semibold text-gray-700" href="/contact/">連絡</a>
        </div>
      </nav>
    </header>

    <main class="py-10">
      <div class="max-w-3xl mx-auto px-6">
        <article class="bg-white rounded-3xl shadow-lg p-8 animate-slide-up ui-card">
          <p class="text-sm text-gray-500 mb-2">2026年1月12日</p>
          <h2 class="text-3xl font-semibold text-sky-600 mb-6">初春の海岸清掃レポート</h2>
          <div class="space-y-4 text-lg">
            <p>
              2026年最初の活動は、穏やかな潮風の中で実施しました。気温は低かったものの、参加者同士で声を掛け合いながら海岸線を丁寧に清掃しました。
            </p>
            <p>
              回収したごみはプラスチック容器や発泡スチロールが中心で、合計でおよそ6袋分。活動後は集積場所まで分別し、地域の清掃担当の方に引き渡しました。
            </p>
            <p>
              次回は拾い集めたごみの内訳や新しい取り組みを共有する予定です。参加してくれた皆さん、ありがとうございました！
            </p>
          </div>
          <div class="mt-8">
            <a class="text-sky-600 font-semibold" href="/report/">← 活動記録一覧へ戻る</a>
          </div>
        </article>
      </div>
    </main>
  </body>
</html>
